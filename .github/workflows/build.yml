name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Siapkan proyek dari ZIP
        run: |
          ZIP=$(ls *.zip | head -n 1)
          unzip -q "$ZIP" -d proyek
          PROJ_DIR=$(find proyek -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          if [ -f "$PROJ_DIR/../settings.gradle" ] || [ -f "$PROJ_DIR/../settings.gradle.kts" ]; then
            ROOT_DIR=$(dirname "$PROJ_DIR")
          else
            ROOT_DIR="$PROJ_DIR"
          fi
          echo "ROOT_DIR=$ROOT_DIR" >> $GITHUB_ENV

      - name: Build Debug APK
        working-directory: ${{ env.ROOT_DIR }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TranskripQu-APK
          path: ${{ env.ROOT_DIR }}/app/build/outputs/apk/debug/*.apk
